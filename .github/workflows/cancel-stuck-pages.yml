name: cancel stuck pages deployment
on:
  push:
    paths:
      - .github/workflows/cancel-stuck-pages.yml
permissions:
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          call() {
            method="$1"
            path="$2"
            echo "=== $method $path ==="
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "${3:-{}}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}${path}")
            echo "http:${code}"
            cat /tmp/body || true
            echo
          }
          call DELETE /pages/builds/1287320071
          call POST /pages/builds/1287320071/cancel
          call PUT /pages/deployment/cancel/f28dea8a222bd41c6b96d58d3a198862cf34bf8d
          call POST /pages/deployments/f28dea8a222bd41c6b96d58d3a198862cf34bf8d/cancel
          call PUT /pages/deployment/cancel/7d63a61d69a3bc490bd9fa93780112a22ad9f409
          call GET /pages/builds/latest
