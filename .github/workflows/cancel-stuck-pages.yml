name: cancel stuck pages deployment
on:
  push:
    paths:
      - .github/workflows/cancel-stuck-pages.yml
permissions:
  pages: write
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stuck Pages deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for id in 7098367796 7098631535 7098699435 7098739598; do
            echo "delete deployment $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}" || true
          done
          echo "cancel pages deployment 7d63a61"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/7d63a61d69a3bc490bd9fa93780112a22ad9f409/cancel" || true
          gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/7d63a61d69a3bc490bd9fa93780112a22ad9f409" || true
